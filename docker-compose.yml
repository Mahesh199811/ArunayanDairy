services:

  user-service:
    build:
      context: ./services/UserService/UserService.Api
      dockerfile: Dockerfile
    container_name: arunayandairy-user-service
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - arunayandairy-network

  product-service:
    build:
      context: ./services/ProductService/ProductService.Api
      dockerfile: Dockerfile
    container_name: arunayandairy-product-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - arunayandairy-network

  order-service:
    build:
      context: ./services/OrderService/OrderService.Api
      dockerfile: Dockerfile
    container_name: arunayandairy-order-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - product-service
    networks:
      - arunayandairy-network

networks:
  arunayandairy-network:
    driver: bridge
