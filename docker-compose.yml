services:

  mysql:
    image: mysql:8.4
    container_name: arunayandairy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: arunayandairy_users
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - arunayandairy-network

  user-service:
    build:
      context: ./services/UserService/UserService.Api
      dockerfile: Dockerfile
    container_name: arunayandairy-user-service
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=arunayandairy_users;User=root;Password=rootpassword;"
    depends_on:
      - mysql
    networks:
      - arunayandairy-network

  product-service:
    build:
      context: ./services/ProductService/ProductService.Api
      dockerfile: Dockerfile
    container_name: arunayandairy-product-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=arunayandairy_products;User=root;Password=rootpassword;"
    depends_on:
      - mysql
    networks:
      - arunayandairy-network

  order-service:
    build:
      context: ./services/OrderService/OrderService.Api
      dockerfile: Dockerfile
    container_name: arunayandairy-order-service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=arunayandairy_orders;User=root;Password=rootpassword;"
      Services__ProductService: "http://product-service:8080/"
    depends_on:
      - mysql
      - product-service
    networks:
      - arunayandairy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arunayandairy-frontend
    ports:
      - "3000:80"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - arunayandairy-network

volumes:
  mysql-data:

networks:
  arunayandairy-network:
    driver: bridge
